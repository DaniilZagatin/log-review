[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pko"
version = "0.1.0"
description = "Белка — восстановление варианта бизнес-сценария по коду одной или нескольких АС"
requires-python = ">=3.11"
dependencies = [
    # Один исследователь использует OpenAI-совместимый endpoint.
    "openai>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Трассировка в Phoenix (`PKO_PHOENIX_ENABLED=true`): OTel SDK и экспортёр.
# Без неё CLI работает как прежде, трейсы просто не собираются.
phoenix = ["arize-phoenix-otel>=0.17"]

[project.scripts]
pko = "pko.cli:run"

[tool.pytest.ini_options]
# Тесты написаны на unittest и запускаются как `make test`; эта секция нужна,
# чтобы их подхватывал и pytest, если сборочный контур использует его.
testpaths = ["tests"]
pythonpath = ["backend", "tests"]

[tool.setuptools.packages.find]
# HTML-карта собирается автономным рендерером, без отдельного frontend build.
where = ["backend"]

[tool.setuptools.package-data]
"pko.scenario_map" = ["*.md"]
"pko.render" = ["assets/dpss/*.woff2", "assets/dpss/*.md"]
