[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "process-observability"
version = "0.1.0"
description = "Local agent that prepares a business process for digital monitoring (skeleton)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tokens = ["tokenizers"]

[tool.setuptools.packages.find]
where = ["src"]

# The vendored map renderer reads these files at report time; they must ship with a wheel.
[tool.setuptools.package-data]
"process_observability.map_presentation" = ["PROVENANCE.md", "assets/dpss/*.woff2", "assets/dpss/PROVENANCE.md",
                                            "assets/horizon/tokens.css"]
