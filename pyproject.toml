[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-observability"
version = "0.2.0"
description = "Scenario onboarding assistant: Belka map, logs, improvements, metrics and offline HTML."
requires-python = ">=3.11"
dependencies = ["openai>=1.30", "httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
phoenix = ["arize-phoenix-otel>=0.17"]

[project.scripts]
process-observability = "process_observability.cli:main"
pko = "pko.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"process_observability.map_presentation" = ["PROVENANCE.md", "assets/dpss/*.woff2", "assets/dpss/PROVENANCE.md", "assets/horizon/tokens.css"]
"pko.scenario_map" = ["*.md"]
"pko.stages" = ["methodology/*.md"]
"pko.render" = ["assets/dpss/*.woff2", "assets/dpss/*.md", "design/horizon/tokens.css", "design/horizon/components/bundle.css"]
